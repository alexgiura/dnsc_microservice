

services:
  dnsc-postgres:
    image: postgres:16-alpine
    container_name: dnsc-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      TZ: ${APP_TIMEZONE:-Europe/Bucharest}
    # Server default timezone: timestamptz columns display like app logs (same IANA name as TZ / APP_TIMEZONE).
    command: ["postgres", "-c", "timezone=${APP_TIMEZONE:-Europe/Bucharest}"]
    volumes:
      - dnsc_pgdata:/var/lib/postgresql/data
      - ./db/init_scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_DB_PORT:-5432}:5432"
    networks:
      - dnsc-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DB_USER} -d ${POSTGRES_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  dnsc-frontend:
    container_name: dnsc-frontend
    image: alexgiura/dnsc-frontend:prod
    restart: unless-stopped
    depends_on:
      - dnsc-backend
    ports:
    - "3000:3000"
    networks:
      - dnsc-net


  dnsc-backend:
    container_name: dnsc-backend
    image: alexgiura/dnsc-backend:prod
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB_HOST: dnsc-postgres
      POSTGRES_DB_PORT: 5432
      TZ: ${APP_TIMEZONE:-Europe/Bucharest}
    depends_on:
      dnsc-postgres:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - dnsc-net

  dozzle:
    image: amir20/dozzle:latest
    container_name: dnsc-dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${DOZZLE_PORT:-3001}:8080"
    networks:
      - dnsc-net

volumes:
  dnsc_pgdata:
    name: dnsc_dnsc_pgdata

networks:
  dnsc-net:
    driver: bridge
