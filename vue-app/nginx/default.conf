server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — resolve dnsc-backend at request time, not at nginx startup
    # (avoids "host not found in upstream" when backend starts after frontend)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream dnsc-backend:8080;
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
